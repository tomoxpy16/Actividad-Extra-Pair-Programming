<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kairos" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Kairos</title>
  <defs>
    <linearGradient id="kairos-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#kairos-bg)"/>
  <!-- esfera del reloj: el tiempo que pasa (chrónos) -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"
          stroke-dasharray="99 33" stroke-linecap="round" transform="rotate(-50 32 32)"/>
  <!-- la K: el trazo vertical y el brazo inferior -->
  <path d="M24 18v28M27.5 32.5 41 46" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- el brazo superior es la aguja que apunta al momento oportuno (kairós) -->
  <path d="M27.5 31.5 39.5 19.5" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="44" cy="15" r="4.5" fill="#fbbf24"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
